<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-10caca66-f467-4547-aa10-7f361d4ca407/styles.css">
<script src="_ds/organic-10caca66-f467-4547-aa10-7f361d4ca407/_ds_bundle.js"></script>
</helmet>
<aside style="width:232px;height:100%;box-sizing:border-box;border-right:1px solid var(--color-divider);background:var(--color-bg);padding:24px 14px;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;align-items:center;gap:10px;padding:0 8px"><div style="width:30px;height:30px;background:var(--color-accent);color:var(--color-bg);border-radius:50%;display:grid;place-items:center;font:400 20px/1.15 var(--font-heading)">T</div><span style="font:400 24px/1.15 var(--font-heading)">Tally</span></div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--color-divider);border-radius:var(--radius-md);background:var(--color-surface)"><div style="display:flex;flex-direction:column;gap:2px"><span style="font:600 11px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-500)">household</span><span style="font-size:14px;font-weight:600">12 Elm St · 3</span></div><span style="display:inline-block;width:16px;height:16px;flex:none;background-color:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/chevrons-up-down.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/chevrons-up-down.svg) center/contain no-repeat"></span></div>
<sc-for list="{{ groups }}" as="grp" hint-placeholder-count="4"><div style="display:flex;flex-direction:column;gap:2px"><div style="font:600 11px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-500);padding:0 10px 6px">{{ grp.g }}</div><sc-for list="{{ grp.items }}" as="it"><sc-if value="{{ it.on }}"><div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:14px;font-weight:700;background:var(--color-accent-200);color:var(--color-accent-900);border-radius:999px"><span>{{ it.l }}</span><span style="font:600 11px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700)">{{ it.c }}</span></div></sc-if><sc-if value="{{ it.off }}"><div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:14px;color:var(--color-neutral-600);border-radius:var(--radius-md)" style-hover="background:var(--color-surface);color:var(--color-text)"><span>{{ it.l }}</span><span style="font:600 11px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700)">{{ it.c }}</span></div></sc-if></sc-for></div></sc-for>
<div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
<button class="btn btn-primary" style="width:100%;white-space:nowrap"><span style="display:inline-block;width:16px;height:16px;flex:none;background-color:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/camera.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/camera.svg) center/contain no-repeat"></span>Scan receipt</button>
<button class="btn btn-secondary" style="width:100%;white-space:nowrap"><span style="display:inline-block;width:16px;height:16px;flex:none;background-color:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/plus.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/plus.svg) center/contain no-repeat"></span>Add expense</button>
<div style="display:flex;align-items:center;gap:10px;padding:12px 8px 0;font-size:14px"><div style="width:28px;height:28px;border-radius:50%;background:var(--color-accent-2-200);color:var(--color-accent-2-900);display:grid;place-items:center;font:700 12px/1 var(--font-body)">AR</div><span>Alex Rivera</span></div>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:232,&quot;height&quot;:960},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Overview&quot;,&quot;Transactions&quot;,&quot;Accounts&quot;,&quot;Household&quot;,&quot;Settle up&quot;,&quot;Members&quot;,&quot;Inbox&quot;,&quot;Receipt review&quot;,&quot;Rules&quot;,&quot;Records &amp; export&quot;,&quot;Audit trail&quot;],&quot;default&quot;:&quot;Overview&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'Overview';
    const G = [['personal', ['Overview', 'Transactions', 'Accounts']], ['household', ['Household', 'Settle up', 'Members']], ['review', ['Inbox', 'Receipt review', 'Rules']], ['records', ['Records & export', 'Audit trail']]];
    const c = { Inbox: '7', 'Receipt review': '2', Rules: '2', 'Settle up': '1' };
    return { groups: G.map(([g, items]) => ({ g, items: items.map(l => ({ l, c: c[l] || '', on: l === a, off: l !== a })) })) };
  }
}
</script>
</body>
</html>
