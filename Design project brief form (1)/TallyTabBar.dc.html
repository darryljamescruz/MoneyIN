<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-10caca66-f467-4547-aa10-7f361d4ca407/styles.css">
<script src="_ds/organic-10caca66-f467-4547-aa10-7f361d4ca407/_ds_bundle.js"></script>
</helmet>
<nav style="display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 8px 30px;border-top:1px solid var(--color-divider);background:var(--color-bg)">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
<sc-if value="{{ t.scan }}"><div style="display:flex;justify-content:center"><div style="width:56px;height:56px;border-radius:50%;background:var(--color-accent);color:var(--color-bg);display:grid;place-items:center"><span style="display:inline-block;width:26px;height:26px;flex:none;background-color:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/camera.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/camera.svg) center/contain no-repeat"></span></div></div></sc-if>
<sc-if value="{{ t.reg }}"><div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:48px;justify-content:center;color:{{ t.col }};position:relative"><span style="display:inline-block;width:24px;height:24px;flex:none;background-color:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/{{ t.i }}.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/{{ t.i }}.svg) center/contain no-repeat"></span><span style="font:700 10px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase">{{ t.l }}</span><sc-if value="{{ t.n }}"><span style="position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--color-accent);color:var(--color-bg);font:700 11px/18px var(--font-body);text-align:center">{{ t.n }}</span></sc-if></div></sc-if>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;Activity&quot;,&quot;Inbox&quot;,&quot;Household&quot;],&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'Home';
    const T = [['Home', 'house'], ['Activity', 'list'], ['Scan', ''], ['Inbox', 'inbox', '7'], ['Household', 'users']];
    return { tabs: T.map(([l, i, n]) => ({ l, i, n, scan: l === 'Scan', reg: l !== 'Scan', col: l === a ? 'var(--color-text)' : 'var(--color-neutral-700)' })) };
  }
}
</script>
</body>
</html>
